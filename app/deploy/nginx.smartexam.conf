# Nginx untuk Smartexam by AILO. Ganti smartexam.example.com dengan domain Anda, lalu:
#   sudo cp deploy/nginx.smartexam.conf /etc/nginx/sites-available/smartexam
#   sudo ln -s /etc/nginx/sites-available/smartexam /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d smartexam.example.com     (menambah blok HTTPS dan pengalihan dari HTTP)
server {
    listen 80;
    server_name smartexam.example.com;

    # Unggahan audio dan gambar soal (maks 15 MB per berkas)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WAJIB menimpa (bukan menambah): batas laju memakai header ini, jadi klien tidak boleh memalsukannya.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
